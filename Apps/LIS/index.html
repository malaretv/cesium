<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>QTS-3D (dev)</title>
    <link rel="stylesheet" href="LIS.css" media="screen" />
    <link rel="stylesheet" href="ThirdParty/dtsel-master/dtsel.css" />

    <script type="text/javascript" src="./Sandcastle-header.js"></script>
    <script type="text/javascript" src="./Sandcastle-helpers.js"></script>
    <script
      type="text/javascript"
      src="ThirdParty/dtsel-master/dtsel.js"
    ></script>
    <script>
      window.LIS_MODE = "development";
    </script>
  </head>
  <body
    class="sandcastle-loading"
    data-sandcastle-bucket="bucket-requirejs.html"
  >
    <div id="cesiumContainer" class="fullSize"></div>
    <div id="loadingOverlay"><h1>Loading...</h1></div>
    <div id="toolbarWrapper">
      <a
        href="http://www.actgate.com/quickmap.html"
        target="_blank"
        rel="noopener noreferrer"
        className="ActLogo"
        onClick="{preventOnMobile}"
      >
        <img alt="ACT LOGO" src="./images/act_logo50.jpg" />
      </a>
      <div class="lds-ellipsis" id="map-loading">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
      </div>
      <div id="toolbar"></div>
      <div id="toolbar-label"></div>
      <div id="toolbar-buttons"></div>
      <div id="toolbar-buttons-ctrls"></div>
    </div>

    <script type="module" src="LIS.js"></script>
  </body>
</html>
